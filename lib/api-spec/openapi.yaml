openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: inference
    description: Server-side YOLO inference
  - name: groq
    description: MahaFlow AI transportation assistant
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health:
    get:
      operationId: inferenceHealth
      tags: [inference]
      summary: YOLO worker health
      responses:
        "200":
          description: Model is configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InferenceHealth"
        "503":
          description: Model is not configured
  /detect:
    post:
      operationId: detectPeople
      tags: [inference]
      summary: Detect people in a real CCTV frame
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetectionRequest"
      responses:
        "200":
          description: YOLO detections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionResponse"
        "400":
          description: Invalid request
        "503":
          description: YOLO model is not configured
  /groq/chat:
    post:
      operationId: chatWithMahaFlowAI
      tags: [groq]
      summary: Ask MahaFlow AI a transportation question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroqChatRequest"
      responses:
        "200":
          description: MahaFlow AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroqChatResponse"
        "400":
          description: Invalid request
        "429":
          description: Rate limited
        "502":
          description: AI provider unavailable
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    InferenceHealth:
      type: object
      properties:
        status:
          type: string
        inference:
          type: string
        model_configured:
          type: boolean
        model_name:
          type: string
      required: [status, inference, model_configured, model_name]
    DetectionRequest:
      type: object
      properties:
        image_base64:
          type: string
          description: Base64-encoded image or data URL containing a real CCTV frame
        capacity:
          type: number
          minimum: 1
        confidence:
          type: number
          minimum: 0.01
          maximum: 0.99
      required: [image_base64]
    DetectionBox:
      type: object
      properties:
        x1: { type: number }
        y1: { type: number }
        x2: { type: number }
        y2: { type: number }
        confidence: { type: number }
      required: [x1, y1, x2, y2, confidence]
    DetectionResponse:
      type: object
      properties:
        ok:
          type: boolean
        count:
          type: integer
        boxes:
          type: array
          items:
            $ref: "#/components/schemas/DetectionBox"
        crowd_level:
          type: string
          enum: [Low, Medium, High]
        crowd_percentage:
          type: [number, "null"]
        model:
          type: string
      required: [ok, count, boxes, crowd_level, crowd_percentage, model]
    GroqChatRequest:
      type: object
      properties:
        messages:
          type: array
          maxItems: 24
          items:
            type: object
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                type: string
                maxLength: 6000
            required: [role, content]
        context:
          type: object
          additionalProperties: true
      required: [messages]
    GroqChatResponse:
      type: object
      properties:
        message:
          type: string
        assistant:
          type: string
      required: [message, assistant]

